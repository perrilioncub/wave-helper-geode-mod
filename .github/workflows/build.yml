name: Build Geode Mod

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release using the version in mod.json"
        type: boolean
        default: false
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    name: Geometry tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run tests
        run: |
          cmake -S tests -B build-tests
          cmake --build build-tests
          ctest --test-dir build-tests --output-on-failure

  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        - name: macOS
          os: macos-latest

        - name: iOS
          os: macos-latest
          target: iOS

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['test', 'build']
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      # Publishes a GitHub Release with the .geode file, either from a pushed
      # tag like v1.0.0 or from a manual run with "release" ticked.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTPUT: ${{ steps.build.outputs.build-output }}
        run: |
          version=$(jq -r .version mod.json)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match mod.json version $version"
            exit 1
          fi
          mapfile -t files < <(find "$BUILD_OUTPUT" -name '*.geode')
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No .geode file found in $BUILD_OUTPUT"
            exit 1
          fi
          gh release create "$version" "${files[@]}" \
            --target "$GITHUB_SHA" \
            --title "Wave Helper $version" \
            --notes-file changelog.md
